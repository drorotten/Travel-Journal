document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:34px 0 22px;\">\n              <div style=\"font-family:'Frank Ruhl Libre',serif; font-size:34px; font-weight:700;\">{{ tripTitle }}<\u002Fdiv>\n              <div style=\"color:#6b7a85; margin-top:6px;\">{{ tripMeta }} · עדכון אחרון {{ lastUpdate }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-for list=\"{{ daysUI }}\" as=\"d\" hint-placeholder-count=\"3\">\n              <article style=\"background:#f7f7f5; border:1px solid #e2e4e0; border-radius:18px; padding:22px; margin-bottom:16px;\">\n                <div style=\"display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;\">\n                  <span style=\"background:#2c5c72; color:#fff; font-size:12px; padding:3px 9px; border-radius:999px;\">יום {{ d.day_number }}<\u002Fspan>\n                  <span style=\"font-family:'Frank Ruhl Libre',serif; font-size:22px; font-weight:700; color:#2c5c72;\">{{ d.title }}<\u002Fspan>\n                  <span style=\"font-size:13px; color:#6b7a85; margin-inline-start:auto;\">{{ d.dateLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; font-size:12.5px; color:#4b5b66;\">\n                  <sc-if value=\"{{ d.hasDistance }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span style=\"background:#eceeea; border-radius:8px; padding:4px 9px;\">{{ d.distanceLabel }}<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ d.hasDrive }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span style=\"background:#eceeea; border-radius:8px; padding:4px 9px;\">{{ d.drive_time }}<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ d.hasWeather }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span style=\"background:#eceeea; border-radius:8px; padding:4px 9px;\">{{ d.weather_description }}<\u002Fspan>\n                  <\u002Fsc-if>\n                  <span style=\"background:#eceeea; border-radi or:#9aa7ae; margin-top:6px; font-size:15px;\">{{ authorsLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n\n              <sc-for list=\"{{ daysUI }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <section data-book-page=\"\" style=\"padding:44px 0; border-bottom:1px solid #eceeea;\">\n                  <div style=\"display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;\">\n                    <span style=\"font-family:'Frank Ruhl Libre',serif; font-size:15px; color:#9c6b3c;\">יום {{ d.day_number }}<\u002Fspan>\n                    <span style=\"font-size:14px; color:#9aa7ae;\">{{ d.dateLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <h2 style=\"font-family:'Frank Ruhl Libre',serif; font-size:clamp(26px,4vw,34px); font-weight:700; margin:6px 0 0; line-height:1.25; color:#2c5c72;\">{{ d.title }}<\u002Fh2>\n                  <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-top:18px; padding:14px 0; border-block:1px solid #eceeea; font-size:14px;\">\n                    <div><span style=\"color:#9aa7ae;\">מרחק<\u002Fspan><br>{{ d.distance_km }} ק״מ<\u002Fdiv>\n                    <div><span style=\"color:#9aa7ae;\">נסיעה<\u002Fspan><br>{{ d.drive_time }}<\u002Fdiv>\n                    <div><span style=\"color:#9aa7ae;\">מזג אוויר<\u002Fspan><br>{{ d.weather_description }}<\u002Fdiv>\n                    <div><span style=\"color:#9aa7ae;\">זריחה/שקיעה<\u002Fspan><br>{{ d.sunrise_time }} · {{ d.sunset_time }}<\u002Fdiv>\n                    <div><span style=\"color:#9aa7ae;\">מעבורות<\u002Fspan><br>{{ d.ferriesLabel }}<\u002Fdiv>\n                    <div><span style=\"color:#9aa7ae;\">מלון<\u002Fspan><br>{{ d.hotelLabel }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ d.hasPlan }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"margin-top:20px;\">\n                      <div style=\"font-family:'Frank Ruhl Libre',serif; font-size:18px; font-weight:700; color:#2c5c72;\">אטרקציות ותכנית היום<\u002Fdiv>\n                      <p style=\"margin:6px 0 0; font-size:16.5px; line-height:1.9; color:#25333d; white-space:pre-line;\">{{ d.attractionsLabel }}<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-for list=\"{{ d.sections }}\" as=\"s\" hint-placeholder-count=\"4\">\n                    <div style=\"margin-top:22px;\">\n                      <div style=\"font-family:'Frank Ruhl Libre',serif; font-size:18px; font-weight:700; color:#2c5c72;\">{{ s.label }}<\u002Fdiv>\n                      <p style=\"margin:6px 0 0; font-size:16.5px; line-height:1.95; color:#25333d; text-wrap:pretty; white-space:pre-line;\">{{ s.value }}<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <sc-if value=\"{{ d.hasMedia }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-top:22px;\">\n                      <sc-for list=\"{{ d.media }}\" as=\"m\">\n                        <div role=\"img\" sc-camel-on-click=\"{{ m.open }}\" aria-label=\"{{ m.name }}\" style=\"{{ m.bookStyle }}\">\n                          <sc-if value=\"{{ m.isYoutube }}\" hint-placeholder-val=\"{{ false }}\">\n                            <span style=\"position:absolute; inset:0; display:grid; place-items:center;\"><span style=\"width:40px; height:40px; border-radius:50%; background:rgba(15,31,40,.72); color:#fff; display:grid; place-items:center; font-size:15px; padding-inline-start:3px;\">▶<\u002Fspan><\u002Fspan>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fsection>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isImport }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width:920px; margin:0 auto; display:grid; gap:16px;\">\n            <section style=\"background:#f7f7f5; border:1px solid #e2e4e0; border-radius:18px; padding:20px 22px;\">\n              <div style=\"font-family:'Frank Ruhl Libre',serif; font-size:22px; font-weight:700; color:#2c5c72;\">ייבוא תכנית הטיול<\u002Fdiv>\n              <div style=\"font-size:14.5px; color:#43535e; line-height:1.8; margin-top:8px;\">הדביקו את הטבלה מגוגל שיטס או מאקסל (העתקה רגילה של השורות). כל שורה = יום. סדר העמודות:<\u002Fdiv>\n              <div style=\"display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; font-size:13px;\">\n                <span style=\"background:#e2ecf1; color:#2c5c72; border-radius:8px; padding:5px 10px;\">תאריך<\u002Fspan>\n                <span style=\"background:#e2ecf1; color:#2c5c72; border-radius:8px; padding:5px 10px;\">יעד<\u002Fspan>\n                <span style=\"background:#e2ecf1; color:#2c5c72; border-radius:8px; padding:5px 10px;\">מלון<\u002Fspan>\n                <span style=\"background:#e2ecf1; color:#2c5c72; border-radius:8px; padding:5px 10px;\">קישור מפת גוגל<\u002Fspan>\n                <span style=\"background:#e2ecf1; color:#2c5c72; border-radius:8px; padding:5px 10px;\">אטרקציות<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:13px; color:#9aa7ae; margin-top:10px; line-height:1.7;\">מפרידים: טאב, נקודה‑פסיק או פסיק. שורת כותרות מזוהה ומדולגת. אטרקציות אפשר להפריד ב־/ או ב־| והן יהפכו לשורות. הקישור יזוהה אוטומטית בכל מקום בשורה.<\u002Fdiv>\n              <textarea value=\"{{ importText }}\" sc-camel-on-change=\"{{ onImportText }}\" rows=\"10\" dir=\"auto\" placeholder=\"14/06/2026\tאוסלו\tHotel Bristol\thttps://maps.app.goo.gl/xxx\tאופרה / מוזיאון מונק\" style=\"width:100%; box-sizing:border-box; border:1px solid #d8dad6; border-radius:12px; padding:14px; font-size:15px; background:#fff; outline:none; line-height:1.8; margin-top:16px;\"><\u002Ftextarea>\n              <div style=\"display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px;\">\n                <button sc-camel-on-click=\"{{ onParse }}\" style=\"border:0; background:#2c5c72; color:#fff; padding:13px 20px; border-radius:12px; font-size:15px; cursor:pointer;\" style-hover=\"background:#1d3a49;\">בדיקת התכנית<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ onSample }}\" style=\"border:1px solid #d8dad6; background:transparent; color:#4b5b66; padding:13px 18px; border-radius:12px; font-size:14px; cursor:pointer;\">הדגמה עם טבלה לדוגמה<\u002Fbutton>\n                <span style=\"font-size:13.5px; color:#6b7a85;\">{{ importStatus }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsection>\n\n            <sc-if value=\"{{ hasPreview }}\" hint-placeholder-val=\"{{ false }}\">\n              <section style=\"background:#f7f7f5; border:1px solid #e2e4e0; border-radius:18px; padding:20px 22px;\">\n                <div style=\"display:flex; align-items:center; gap:12px; flex-wrap:wrap;\">\n                  <span style=\"font-family:'Frank Ruhl Libre',serif; font-size:19px; font-weight:700; color:#2c5c72;\">{{ previewCount }} ימים זוהו<\u002Fspan>\n                  <span style=\"font-size:13px; color:#6b7a85;\">{{ geoNote }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:grid; gap:10px; margin-top:14px;\">\n                  <sc-for list=\"{{ preview }}\" as=\"p\" hint-placeholder-count=\"3\">\n                    <div style=\"background:#fff; border:1px solid #e6e8e4; border-radius:12px; padding:12px 14px;\">\n                      <div style=\"display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;\">\n                        <span style=\"background:#2c5c72; color:#fff; font-size:11.5px; padding:3px 8px; border-radius:999px;\">יום {{ p.day_number }}<\u002Fspan>\n                        <span style=\"font-weight:500; color:#2c5c72;\">{{ p.destination }}<\u002Fspan>\n                        <span style=\"font-size:13px; color:#6b7a85; margin-inline-start:auto;\">{{ p.dateLabel }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"font-size:13.5px; color:#43535e; line-height:1.7; margin-top:6px;\">{{ p.summary }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;\">\n                  <button sc-camel-on-click=\"{{ onImportMerge }}\" style=\"border:0; background:#2c5c72; color:#fff; padding:14px 20px; border-radius:12px; font-size:15px; cursor:pointer; flex:1;\" style-hover=\"background:#1d3a49;\">עדכון על היומן הקיים (שומר טקסטים ומדיה)<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ onImportReplace }}\" style=\"border:1px solid #e0d0cc; background:transparent; color:#a33b2f; padding:14px 18px; border-radius:12px; font-size:14.5px; cursor:pointer;\">החלפת כל היומן<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsection>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isSync }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width:820px; margin:0 auto; display:grid; gap:16px;\">\n            <section style=\"background:#f7f7f5; border:1px solid #e2e4e0; border-radius:18px; padding:20px 22px;\">\n              <div style=\"font-family:'Frank Ruhl Libre',serif; font-size:22px; font-weight:700; color:#2c5c72;\">סנכרון חי בין המכשירים<\u002Fdiv>\n              <div style=\"font-size:14.5px; color:#43535e; line-height:1.8; margin-top:8px;\">מחברים פעם אחת את פרטי הפרויקט ב‑Supabase, ומאותו רגע כל שמירה נשלחת לשרת וכל מכשיר שולף עדכונים אוטומטית — כולל קישור הצפייה למשפחה.<\u002Fdiv>\n              <div style=\"display:grid; gap:12px; margin-top:18px;\">\n                <label style=\"display:grid; gap:5px; font-size:13px; color:#2c5c72;\">Project URL\n                  <input value=\"{{ cfg.url }}\" sc-camel-on-change=\"{{ onCfgUrl }}\" dir=\"ltr\" placeholder=\"https://xxxx.supabase.co\" style=\"border:1px solid #d8dad6; border-radius:10px; padding:12px; font-size:15px; background:#fff; outline:none;\">\n                <\u002Flabel>\n                <label style=\"display:grid; gap:5px; font-size:13px; color:#2c5c72;\">anon public key\n                  <input value=\"{{ cfg.key }}\" sc-camel-on-change=\"{{ onCfgKey }}\" dir=\"ltr\" placeholder=\"eyJhbGciOi...\" style=\"border:1px solid #d8dad6; border-radius:10px; padding:12px; font-size:14px; background:#fff; outline:none;\">\n                <\u002Flabel>\n                <label style=\"display:grid; gap:5px; font-size:13px; color:#2c5c72;\">כתובת האחסון הציבורי (לקישור הצפייה)\n                  <input value=\"{{ cfg.host }}\" sc-camel-on-change=\"{{ onCfgHost }}\" dir=\"ltr\" placeholder=\"https://drorotten.github.io/Travel-Journal/index.html\" style=\"border:1px solid #d8dad6; border-radius:10px; padding:12px; font-size:13.5px; background:#fff; outline:none;\">\n                <\u002Flabel>\n                <label style=\"display:grid; gap:5px; font-size:13px; color:#2c5c72;\">מזהה הטיול (trip_id)\n                  <input value=\"{{ cfg.trip }}\" sc-camel-on-change=\"{{ onCfgTrip }}\" dir=\"ltr\" placeholder=\"norway-2026\" style=\"border:1px solid #d8dad6; border-radius:10px; padding:12px; font-size:15px; background:#fff; outline:none;\">\n                <\u002Flabel>\n              <\u002Fdiv>\n              <div style=\"display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;\">\n                <button sc-camel-on-click=\"{{ onConnect }}\" style=\"border:0; background:#2c5c72; color:#fff; padding:13px 20px; border-radius:12px; font-size:15px; cursor:pointer;\" style-hover=\"background:#1d3a49;\">התחברות ובדיקה<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ onPushAll }}\" style=\"border:1px solid #d8dad6; background:transparent; color:#2c5c72; padding:13px 18px; border-radius:12px; font-size:14.5px; cursor:pointer;\">העלאת כל היומן לשרת<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ onPullNow }}\" style=\"border:1px solid #d8dad6; background:transparent; color:#2c5c72; padding:13px 18px; border-radius:12px; font-size:14.5px; cursor:pointer;\">שליפה עכשיו<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ onResetFromServer }}\" style=\"border:1px solid #e0d0cc; background:transparent; color:#a33b2f; padding:13px 18px; border-radius:12px; font-size:14.5px; cursor:pointer;\">החלפת היומן בדפדפן בזה שבשרת<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"font-size:13.5px; color:#6b7a85; margin-top:12px;\">{{ syncState }}<\u002Fdiv>\n            <\u002Fsection>\n\n            <sc-if value=\"{{ liveUrl }}\" hint-placeholder-val=\"{{ false }}\">\n              <section style=\"background:#f7f7f5; border:1px solid #e2e4e0; border-radius:18px; padding:20px 22px;\">\n                <div style=\"font-family:'Frank Ruhl Libre',serif; font-size:19px; font-weight:700; color:#2c5c72;\">קישור צפייה חי למשפחה<\u002Fdiv>\n                <div style=\"font-size:13.5px; color:#6b7a85; margin-top:6px; line-height:1.7;\">נפתח במצב קריאה בלבד ומציג את מה שיש בשרת באותו רגע.<\u002Fdiv>\n                <sc-if value=\"{{ liveHostWarning }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:13.5px; color:#8a5a2b; background:#fdf4e7; border:1px solid #f0dcc0; border-radius:10px; padding:11px 13px; margin-top:10px; line-height:1.7;\">{{ liveHostWarning }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:flex; gap:8px; align-items:stretch; flex-wrap:wrap; margin-top:12px;\">\n                  <input value=\"{{ liveUrl }}\" readonly=\"\" dir=\"ltr\" sc-camel-on-focus=\"{{ onSelectRoute }}\" style=\"flex:1; min-width:220px; border:1px solid #d8dad6; border-radius:10px; padding:11px 12px; font-size:12.5px; background:#fff; color:#4b5b66;\">\n                  <button sc-camel-on-click=\"{{ onCopyLive }}\" style=\"border:1px solid #d8dad6; background:#eef3f6; color:#2c5c72; border-radius:10px; padding:11px 16px; font-size:14px; cursor:pointer; white-space:nowrap;\" style-hover=\"background:#e2ecf1;\">{{ liveCopyLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsection>\n            <\u002Fsc-if>\n\n            <section style=\"background:#f7f7f5; border:1px solid #e2e4e0; border-radius:18px; padding:20px 22px;\">\n              <div style=\"font-family:'Frank Ruhl Libre',serif; font-size:19px; font-weight:700; color:#2c5c72;\">הקמה חד‑פעמית ב‑Supabase<\u002Fdiv>\n              <ol style=\"font-size:14.5px; color:#43535e; line-height:2; margin:10px 0 0; padding-inline-start:22px;\">\n                <li>פותחים פרויקט חדש ב‑supabase.com (חינמי).<\u002Fli>\n                <li>ב‑SQL Editor מריצים את הקובץ <code dir=\"ltr\">supabase-schema.sql<\u002Fcode> שנמצא בפרויקט — הוא יוצר את הטבלאות, ההרשאות ודלי המדיה.<\u002Fli>\n                <li>ב‑Project Settings → Data API (בגרסאות מסוימות: API) מעתיקים את ה‑Project URL ואת ה‑anon public key לשדות שלמעלה. אם לא מוצאים — אפשר פשוט להעתיק את כתובת הדשבורד מהדפדפן (<code dir=\"ltr\">.../project/xxxx<\u002Fcode>) לשדה למעלה, והאפליקציה תחלץ ממנה את הכתובת הנכונה.<\u002Fli>\n                <li>לוחצים \"העלאת כל היומן לשרת\" פעם אחת, ומאותו רגע שני המכשירים מסונכרנים.<\u002Fli>\n              <\u002Fol>\n            <\u002Fsection>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fmain>\n\n      <sc-if value=\"{{ lightboxUrl }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-noprint=\"\" sc-camel-on-click=\"{{ closeLightbox }}\" style=\"position:fixed; inset:0; z-index:950; background:rgba(15,31,40,.9); display:grid; place-items:center; padding:20px; cursor:zoom-out;\">\n          <div role=\"img\" aria-label=\"{{ lightboxName }}\" style=\"{{ lightboxStyle }}\"><\u002Fdiv>\n
